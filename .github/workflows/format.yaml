name: Format

on:
  push:
    paths:
      - '**.kt'
      - '**.kts'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check with ktfmt
        run: ./gradlew ktfmtCheck
      - name: Generate ktfmt patch on failure
        if: failure()
        run: |
          ./gradlew ktfmtFormat || true
          git diff > ktfmt-fix.patch
      - name: Upload ktfmt patch on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ktfmt-fix.patch
          path: ktfmt-fix.patch
          if-no-files-found: ignore
