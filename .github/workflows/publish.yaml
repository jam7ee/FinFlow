name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build & Release Phone APK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # To publish signed release builds later, configure a keystore in repository secrets
      # and switch to :app:phone:assembleRelease.
      - name: Build phone APKs
        run: ./gradlew :app:phone:assembleDebug

      - name: Prepare release artifacts
        run: |
          mkdir -p release-apks
          TAG="${GITHUB_REF_NAME}"
          cp ./app/phone/build/outputs/apk/libre/debug/phone-libre-arm64-v8a-debug.apk "release-apks/finflow-${TAG}-arm64-v8a-debug.apk"
          cp ./app/phone/build/outputs/apk/libre/debug/phone-libre-armeabi-v7a-debug.apk "release-apks/finflow-${TAG}-armeabi-v7a-debug.apk"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: release-apks/*.apk

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: finflow-phone-apks
          path: release-apks/*.apk
