name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build & Release Phone APK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.FINFLOW_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FINFLOW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINFLOW_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FINFLOW_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Missing signing secrets. Configure FINFLOW_KEYSTORE_BASE64, FINFLOW_KEYSTORE_PASSWORD, FINFLOW_KEY_ALIAS, and FINFLOW_KEY_PASSWORD in repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/finflow-release.jks"

      - name: Build signed release phone APKs
        env:
          FINFLOW_KEYSTORE_PATH: ${{ runner.temp }}/finflow-release.jks
          FINFLOW_KEYSTORE_PASSWORD: ${{ secrets.FINFLOW_KEYSTORE_PASSWORD }}
          FINFLOW_KEY_ALIAS: ${{ secrets.FINFLOW_KEY_ALIAS }}
          FINFLOW_KEY_PASSWORD: ${{ secrets.FINFLOW_KEY_PASSWORD }}
        run: ./gradlew :app:phone:assembleRelease

      - name: Clean up release keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/finflow-release.jks"

      - name: Prepare & verify release artifacts
        run: |
          mkdir -p release-apks
          cp ./app/phone/build/outputs/apk/libre/release/finflow-*-libre-arm64-v8a.apk release-apks/
          cp ./app/phone/build/outputs/apk/libre/release/finflow-*-libre-armeabi-v7a.apk release-apks/
          for apk in release-apks/*.apk; do
            jarsigner -verify -strict "$apk"
          done
          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-apks/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: finflow-release-apks
          path: release-apks/*
